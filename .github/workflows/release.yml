# PAIR Plus release builds.
#
# The public counterpart of NVIDIA's internal signed-release pipeline: builds
# every installer from a version tag, signs and notarizes the macOS builds with
# the repository's Developer ID secrets, and uploads the installers and their
# update feeds (latest-mac.yml, latest-arm64-mac.yml, latest.yml, ...) to a
# DRAFT GitHub release. Nothing reaches users until the draft is published by
# hand on GitHub.
#
# Start it by pushing a tag that matches desktop/package.json, e.g. v1.1.0, or
# run it manually from the Actions tab on such a tag. Each matrix job uploads
# to the same draft, named after the version.
#
# Secrets (Settings > Secrets and variables > Actions):
#   MAC_CERTIFICATE_P12_BASE64    Developer ID Application certificate and
#                                 private key, exported as .p12, base64-encoded
#   MAC_CERTIFICATE_PASSWORD      the .p12 export password
#   APPLE_ID                      Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD   an app-specific password for that Apple ID
# Variable:
#   APPLE_TEAM_ID                 TCDFRMWB65
name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:

# contents: write lets electron-builder create the draft release and upload to
# it with the built-in token.
permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check-version:
        name: Check tag matches the app version
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Compare
              shell: bash
              run: |
                  version="$(node -p "require('./desktop/package.json').version")"
                  if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
                      echo "::error::Run this workflow on tag v${version} (got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})."
                      exit 1
                  fi

    release:
        name: ${{ matrix.name }}
        needs: check-version
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x64
                      os: ubuntu-latest
                      script: release:linux:x64
                    - name: linux-arm64
                      os: ubuntu-latest
                      script: release:linux:arm64
                    - name: win-x64
                      os: windows-latest
                      script: release:win:x64
                    - name: win-arm64
                      os: windows-latest
                      script: release:win:arm64
                    - name: mac-arm64
                      os: macos-latest
                      script: release:mac:arm64
                    - name: mac-x64
                      os: macos-15-intel
                      script: release:mac:x64
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - uses: ./.github/actions/setup
              with:
                  go: 'true'

            - name: Install Linux packaging tools
              if: runner.os == 'Linux'
              run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot rpm

            - run: npm --prefix desktop ci --prefer-offline

            # macOS: put the Developer ID certificate in a dedicated keychain
            # before anything signs. The afterPack hook signs the nested
            # executables before electron-builder would import CSC_LINK on its
            # own, so the identity has to be in the search list from the start.
            # electron-builder then finds the same identity for the bundle.
            - name: Import the signing certificate
              if: runner.os == 'macOS'
              shell: bash
              env:
                  P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
                  P12_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
              run: |
                  if [ -z "${P12_BASE64}" ]; then
                      echo "::error::MAC_CERTIFICATE_P12_BASE64 is not set; macOS releases must be signed to auto-update."
                      exit 1
                  fi
                  keychain="${RUNNER_TEMP}/signing.keychain-db"
                  keychain_password="$(openssl rand -base64 24)"
                  p12="${RUNNER_TEMP}/signing.p12"
                  printf '%s' "${P12_BASE64}" | base64 --decode > "${p12}"
                  security create-keychain -p "${keychain_password}" "${keychain}"
                  security set-keychain-settings -lut 21600 "${keychain}"
                  security unlock-keychain -p "${keychain_password}" "${keychain}"
                  security import "${p12}" -k "${keychain}" -P "${P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain}" > /dev/null
                  security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
                  rm -f "${p12}"
                  security find-identity -v -p codesigning "${keychain}"

            # Then the afterPack hook signs the nested executables and
            # electron-builder signs the bundle with the identity found in the
            # keychain and notarizes it with the APPLE_* variables.
            - name: Build, sign and publish ${{ matrix.name }}
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  PAIR_MAC_SIGN: ${{ runner.os == 'macOS' && '1' || '' }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
              run: npm --prefix desktop run ${{ matrix.script }}

            - name: Remove the signing keychain
              if: always() && runner.os == 'macOS'
              shell: bash
              run: security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" 2>/dev/null || true

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always()
              with:
                  name: release-${{ matrix.name }}
                  path: desktop/release/**
                  retention-days: 14
                  if-no-files-found: warn
