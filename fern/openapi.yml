openapi: 3.0.3
info:
  title: NVIDIA Personal AI Router API
  version: 0.1.0
  description: >
    HTTP interfaces exposed by a local NVIDIA Personal AI Router (PAIR) proxy.
    An application sends a normal engine-compatible request to the local proxy;
    PAIR selects one eligible node and forwards the entire request to that
    node's engine, then streams or returns the response. PAIR routes each
    request to a single node. It does not pool GPU memory, combine GPUs, split a
    model, or migrate an in-flight request.


    Use the exact base URL copied from PAIR's **Endpoints** window. Do not assume
    default engine ports such as `11434` (Ollama) or `1234` (LM Studio).
servers:
  - url: "{baseUrl}"
    description: >
      Local PAIR proxy base URL. Copy the exact value from PAIR's Endpoints
      window for the running engine you want to target.
    variables:
      baseUrl:
        default: http://127.0.0.1:11434
        description: >
          Placeholder only. The real host and port are assigned by PAIR and
          shown in the Endpoints window; do not assume default engine ports.
tags:
  - name: Ollama-compatible
    description: Ollama-compatible inference proxied to an eligible node.
  - name: OpenAI-compatible
    description: OpenAI-compatible inference proxied to an eligible node.
  - name: Sessions
    description: >
      PAIR's own session API, answered by the local proxy on any engine port and
      never forwarded to an engine. Loopback only.
  - name: Node info
    description: Read-only node telemetry polled from discovered PAIR nodes.
paths:
  /api/chat:
    post:
      tags:
        - Ollama-compatible
      operationId: ollamaChat
      summary: Ollama-compatible chat
      description: >
        Send an Ollama-compatible chat request to the local PAIR proxy. PAIR
        forwards the request to one eligible node running a compatible engine
        with the requested model available. With streaming enabled the upstream
        engine returns newline-delimited JSON chunks; the final chunk sets
        `done` to true.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaChatRequest"
            examples:
              default:
                value:
                  model: llama3.1
                  stream: false
                  messages:
                    - role: user
                      content: Explain what NVIDIA Personal AI Router does in one sentence.
      responses:
        "200":
          description: Chat response from the serving node.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-PAIR-Session-ID:
              $ref: "#/components/headers/SessionID"
            X-PAIR-Served-By:
              description: Stable host UUID of the node that served the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaChatResponse"
              examples:
                default:
                  value:
                    model: llama3.1
                    created_at: "2026-06-03T07:45:00Z"
                    message:
                      role: assistant
                      content: >-
                        NVIDIA Personal AI Router routes each AI request to one
                        eligible system on your local network to serve
                        inference.
                    done: true
                    done_reason: stop
                    total_duration: 4200000000
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/chat/completions:
    post:
      tags:
        - OpenAI-compatible
      operationId: createChatCompletion
      summary: OpenAI-compatible chat completion
      description: >
        Send an OpenAI-compatible chat completion request to the local PAIR
        proxy. PAIR forwards the entire request to a single eligible node and
        returns the engine's response.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            examples:
              default:
                value:
                  model: llama3.1
                  messages:
                    - role: user
                      content: Explain what NVIDIA Personal AI Router does in one sentence.
      responses:
        "200":
          description: Chat completion from the serving node.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-PAIR-Session-ID:
              $ref: "#/components/headers/SessionID"
            X-PAIR-Served-By:
              description: Stable host UUID of the node that served the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
              examples:
                default:
                  value:
                    id: chatcmpl-01J0D5P0KZESQHTR2HWK7S5W27
                    object: chat.completion
                    created: 1780000000
                    model: llama3.1
                    choices:
                      - index: 0
                        message:
                          role: assistant
                          content: >-
                            NVIDIA Personal AI Router routes each AI request to
                            one eligible system on your local network to serve
                            inference.
                        finish_reason: stop
                    usage:
                      prompt_tokens: 18
                      completion_tokens: 24
                      total_tokens: 42
        default:
          $ref: "#/components/responses/ErrorResponse"
  /pair/v1/sessions:
    post:
      tags:
        - Sessions
      operationId: createSession
      summary: Create a session
      description: >
        Start a session explicitly, for example to choose its idle timeout.
        Sending `X-PAIR-Session-ID` on an inference request also creates one on
        first use.
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ErrorResponse"
    get:
      tags:
        - Sessions
      operationId: listSessions
      summary: List live sessions
      parameters:
        - name: agentId
          in: query
          required: false
          description: Only sessions owned by this agent.
          schema:
            type: string
      responses:
        "200":
          description: Live sessions, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
  /pair/v1/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Sessions
      operationId: getSession
      summary: Read a session
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags:
        - Sessions
      operationId: updateSession
      summary: Change a session's idle timeout
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idleTimeoutSeconds]
              properties:
                idleTimeoutSeconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
      responses:
        "200":
          description: The updated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags:
        - Sessions
      operationId: endSession
      summary: End a session now
      description: >
        Removes the session and cancels any of its requests still running.
        Reusing the ID afterwards returns `410`.
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "204":
          description: The session has ended.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /pair/v1/sessions/{sessionId}/keepalive:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Sessions
      operationId: keepSessionAlive
      summary: Restart a session's idle clock
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: The session, with its new `expiresAt`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /pair/v1/capacity:
    get:
      tags:
        - Sessions
      operationId: getCapacity
      summary: Report context capacity on this node
      responses:
        "200":
          description: Every model with a setting, a detection, or live sessions here.
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelCapacity"
    put:
      tags:
        - Sessions
      operationId: setCapacity
      summary: Set or clear a model's context capacity on this node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [engine, model]
              properties:
                engine:
                  type: string
                  enum: [ollama, lmstudio, llamacpp]
                model:
                  type: string
                contextTokens:
                  type: integer
                  minimum: 1024
                  description: Total context the model can hold across its sessions.
                maxSessions:
                  type: integer
                  minimum: 1
                  maximum: 1024
                clear:
                  type: boolean
                  description: Remove the setting and fall back to detection.
      responses:
        "200":
          description: The model's capacity with the new setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCapacity"
        "204":
          description: The setting was cleared and nothing else is known about the model.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/node-info:
    get:
      tags:
        - Node info
      operationId: getNodeInfo
      summary: Get node info
      description: >
        Returns telemetry for a discovered PAIR node. The desktop application
        polls this endpoint because the data is not fully represented in the
        broker control surface. The stable host UUID, not the display hostname,
        correlates discovery, membership, workloads, telemetry, and routing.
      responses:
        "200":
          description: Node telemetry snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeInfo"
              examples:
                default:
                  value:
                    uuid: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    hostname: workstation-01
                    addresses:
                      - 192.168.1.24
                      - fe80::1c2d:3e4f:5a6b:7c8d
                    servicePorts:
                      proxy: 51100
                      broker: 51101
                      scanner: 51102
                    trust: trusted
                    cluster:
                      member: true
                      clusterId: cluster_01J0D5TCGS8JQ2N8TZFRA0VN08
                    engines:
                      - ollama
                    models:
                      - name: llama3.1
                        engine: ollama
        default:
          $ref: "#/components/responses/ErrorResponse"
components:
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: >
        Optional caller-chosen request ID, 1 to 128 characters from letters,
        digits, `.`, `_`, `:` and `-`. PAIR mints a version 4 UUID when it is
        absent or outside that set, and never rejects a request because of it.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    SessionID:
      name: X-PAIR-Session-ID
      in: header
      required: false
      description: >
        Optional conversation ID, in the same character set as `X-Request-ID`.
        Send it on every turn: PAIR routes each turn to the node that served the
        previous one so the engine can reuse its cached prompt. The first
        request creates the session. A malformed value is refused with `400`;
        an ended or expired session with `410`; a full session table with `503`.
        When this node's context slots for the model are all held and no other
        node can serve, the request waits for a slot, then gets `503` with
        `Retry-After`. A session whose measured context has reached its share
        gets `400` until it sends a shorter conversation. The response carries
        `X-PAIR-Session-Expires-At`, `X-PAIR-Context-Session-Tokens`,
        `X-PAIR-Context-Session-Limit` and `X-PAIR-Queue-Wait-Ms` as they apply.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    AgentID:
      name: X-PAIR-Agent-ID
      in: header
      required: false
      description: >
        Optional ID of the agent that owns the session. The agent named on a
        session's first request owns it; a later request naming a different
        agent, or none when an owner exists, is refused with `409`.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
  headers:
    SessionID:
      description: The session this request was served under, when it named one.
      schema:
        type: string
    RequestID:
      description: >
        The request ID PAIR used for this request: the caller's own value when
        it was acceptable, otherwise one PAIR minted. Present on every response,
        including errors.
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Error response.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          description: Optional; PAIR mints a version 4 UUID when omitted.
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        agentId:
          type: string
          description: Owning agent. Must match `X-PAIR-Agent-ID` when both are sent.
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        idleTimeoutSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: Omit to use the process default (10 minutes unless configured).
    Session:
      type: object
      required: [sessionId, agentId, createdAt, lastActiveAt, expiresAt, idleTimeoutSeconds, keepaliveIntervalSeconds, inFlight, requests, nodes]
      properties:
        sessionId:
          type: string
        agentId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the session ends if nothing touches it. It never ends while `inFlight` is above zero.
        idleTimeoutSeconds:
          type: integer
        keepaliveIntervalSeconds:
          type: integer
          description: Suggested keepalive interval, one third of the idle timeout.
        inFlight:
          type: integer
        requests:
          type: integer
        nodes:
          type: object
          description: Node that served the session's last turn, per engine.
          additionalProperties:
            type: string
        context:
          type: object
          description: >
            The conversation's size after its last completed turn, per engine,
            as the engine counted it. Absent for an engine until a turn reports
            usage.
          additionalProperties:
            type: object
            required: [model, tokens, promptTokens, completionTokens, updatedAt]
            properties:
              model:
                type: string
              tokens:
                type: integer
                description: promptTokens plus completionTokens.
              promptTokens:
                type: integer
              completionTokens:
                type: integer
              updatedAt:
                type: string
                format: date-time
    ModelCapacity:
      type: object
      required: [engine, model, configured, detected, contextTokens, maxSessions, sessionContextTokens, source, activeSessions, usedContextTokens, heldSlots, queued]
      properties:
        engine:
          type: string
        model:
          type: string
        configured:
          nullable: true
          type: object
          properties:
            contextTokens:
              type: integer
            maxSessions:
              type: integer
        detected:
          nullable: true
          type: object
          description: What the local engine reports for the loaded model. Omitted fields are unknown.
          properties:
            windowTokens:
              type: integer
            slots:
              type: integer
            poolTokens:
              type: integer
            basis:
              type: string
        contextTokens:
          type: integer
          description: Effective pool; 0 when unknown.
        maxSessions:
          type: integer
          description: Effective session count; 0 when unknown.
        sessionContextTokens:
          type: integer
          description: Each session's share, contextTokens ÷ maxSessions rounded down to 1024; 0 when unknown.
        source:
          type: string
          enum: [configured, detected, unknown]
        activeSessions:
          type: integer
          description: Live sessions whose last turn on this engine ran on this node.
        usedContextTokens:
          type: integer
        heldSlots:
          type: integer
          description: Sessions holding one of the model's context slots on this node.
        queued:
          type: integer
          description: Session requests waiting for a slot.
        warning:
          type: string
    ChatRole:
      type: string
      enum:
        - system
        - user
        - assistant
        - tool
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          $ref: "#/components/schemas/ChatRole"
        content:
          type: string
          example: Explain what NVIDIA Personal AI Router does in one sentence.
    OllamaChatRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Model name that must be available on an eligible node.
          example: llama3.1
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
          description: >
            When true (the Ollama default), the response is streamed as
            newline-delimited JSON chunks.
          default: true
    OllamaChatResponse:
      type: object
      required:
        - model
        - message
        - done
      properties:
        model:
          type: string
          example: llama3.1
        created_at:
          type: string
          format: date-time
        message:
          $ref: "#/components/schemas/ChatMessage"
        done:
          type: boolean
          example: true
        done_reason:
          type: string
          example: stop
        total_duration:
          type: integer
          format: int64
          description: Total request time in nanoseconds, as reported by the engine.
          example: 4200000000
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Model name that must be available on an eligible node.
          example: llama3.1
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          format: float
          minimum: 0
          example: 0.7
        max_tokens:
          type: integer
          minimum: 1
          example: 512
    ChatCompletion:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          example: chatcmpl-01J0D5P0KZESQHTR2HWK7S5W27
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          format: int64
          description: Unix timestamp in seconds.
          example: 1780000000
        model:
          type: string
          example: llama3.1
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
        usage:
          $ref: "#/components/schemas/Usage"
    ChatCompletionChoice:
      type: object
      required:
        - index
        - message
      properties:
        index:
          type: integer
          example: 0
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - tool_calls
            - content_filter
          example: stop
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          example: 18
        completion_tokens:
          type: integer
          example: 24
        total_tokens:
          type: integer
          example: 42
    EngineKind:
      type: string
      enum:
        - ollama
        - lmstudio
    TrustState:
      type: string
      enum:
        - trusted
        - unpaired
        - pending
        - unknown
    NodeModel:
      type: object
      required:
        - name
        - engine
      properties:
        name:
          type: string
          example: llama3.1
        engine:
          $ref: "#/components/schemas/EngineKind"
    ClusterState:
      type: object
      required:
        - member
      properties:
        member:
          type: boolean
          example: true
        clusterId:
          type: string
          nullable: true
          example: cluster_01J0D5TCGS8JQ2N8TZFRA0VN08
    NodeInfo:
      type: object
      required:
        - uuid
        - hostname
        - trust
        - cluster
      properties:
        uuid:
          type: string
          description: Stable host UUID used to correlate discovery and routing.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        hostname:
          type: string
          example: workstation-01
        addresses:
          type: array
          description: Reachable addresses advertised by the node.
          items:
            type: string
          example:
            - 192.168.1.24
        servicePorts:
          type: object
          description: Service ports keyed by service name.
          additionalProperties:
            type: integer
          example:
            proxy: 51100
            broker: 51101
        trust:
          $ref: "#/components/schemas/TrustState"
        cluster:
          $ref: "#/components/schemas/ClusterState"
        engines:
          type: array
          items:
            $ref: "#/components/schemas/EngineKind"
        models:
          type: array
          description: Models reported as available on the node, where reported.
          items:
            $ref: "#/components/schemas/NodeModel"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: model_not_available
        message:
          type: string
          example: No eligible node has the requested model available.
        requestId:
          type: string
          example: req_01J0D5TCGS8JQ2N8TZFRA0VN08
